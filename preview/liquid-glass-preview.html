<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>主播工作台 · Liquid Glass 预览</title>
  <style>
    :root{color-scheme:dark;--ink:#f8fbff;--muted:#aab8cc;--glass:rgba(255,255,255,.12);--glass-strong:rgba(255,255,255,.2);--stroke:rgba(255,255,255,.22);--blue:#7ac7ff;--purple:#b49aff;--shadow:0 24px 80px rgba(0,0,0,.3)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#101626;overflow-x:hidden}body:before,body:after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(8px);opacity:.75;animation:drift 16s ease-in-out infinite alternate}.before{}body:before{width:52vw;height:52vw;left:-18vw;top:-18vw;background:radial-gradient(circle at 60% 60%,#3d78db,transparent 62%)}body:after{width:48vw;height:48vw;right:-12vw;bottom:-18vw;background:radial-gradient(circle at 40% 40%,#7546c8,transparent 62%);animation-delay:-5s}@keyframes drift{to{transform:translate(7vw,4vh) scale(1.12)}}
    .app{min-height:100vh;display:grid;grid-template-columns:84px 1fr}.glass{background:linear-gradient(135deg,rgba(255,255,255,.19),rgba(255,255,255,.06));border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(28px) saturate(145%);-webkit-backdrop-filter:blur(28px) saturate(145%)}aside{padding:22px 15px;border-right:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(8,14,28,.3);backdrop-filter:blur(24px)}.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;margin-bottom:18px;font-size:22px;color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(122,199,255,.15));border:1px solid rgba(255,255,255,.42);box-shadow:0 10px 28px rgba(80,150,255,.28),inset 0 1px rgba(255,255,255,.6)}.nav{width:46px;height:46px;border:0;border-radius:15px;background:transparent;color:var(--muted);font-size:19px;cursor:pointer;transition:.3s}.nav:hover,.nav.active{color:#fff;background:var(--glass-strong);box-shadow:inset 0 1px rgba(255,255,255,.3);transform:translateY(-2px)}.spacer{flex:1}
    main{width:min(1180px,100%);margin:auto;padding:42px 58px 70px}header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:38px}.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.03em}h1{font-size:42px;line-height:1.08;letter-spacing:-.045em;margin:10px 0 0;font-weight:650}h2{font-size:21px;letter-spacing:-.02em;margin:0}.actions{display:flex;gap:10px}.btn{min-height:46px;padding:0 18px;border-radius:980px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);font-size:14px;cursor:pointer;transition:.3s}.btn:hover{transform:scale(1.03);background:var(--glass-strong)}.btn.primary{background:linear-gradient(135deg,#71c8ff,#8e7cff);border-color:rgba(255,255,255,.4);color:#11172a;font-weight:600;box-shadow:0 8px 26px rgba(105,157,255,.35)}
    .hero{display:grid;grid-template-columns:1.18fr .82fr;gap:22px;margin-bottom:40px}.card{border-radius:28px;overflow:hidden}.poster{position:relative;min-height:350px;padding:30px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05))}.poster:before{content:"";position:absolute;width:300px;height:300px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.38),rgba(122,199,255,.08) 45%,transparent 67%);filter:blur(3px)}.poster-label{font-size:12px;color:var(--muted)}.poster-title{position:relative;margin-top:60px;font-size:42px;font-weight:650;line-height:1.08;letter-spacing:-.05em;text-shadow:0 2px 20px rgba(0,0,0,.2)}.poster-sub{position:relative;margin-top:14px;color:#d8e4f5}.poster-meta{position:absolute;bottom:28px;color:var(--muted);font-size:12px}.insight{padding:30px;display:flex;flex-direction:column;justify-content:space-between}.metric{font-size:54px;font-weight:650;letter-spacing:-.06em;margin-top:12px}.metric small{font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0}.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:20px 0 11px}.progress i{display:block;width:72%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--purple));box-shadow:0 0 18px #79c4ff}.caption{color:var(--muted);font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.link{font-size:14px;color:var(--blue)}.songs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.song{min-height:136px;padding:20px;transition:.3s}.song:hover{transform:translateY(-4px) rotateX(1deg);background:rgba(255,255,255,.2)}.song-num{float:right;color:var(--muted);font-size:12px}.song h3{font-size:17px;margin:0 0 8px}.song p{margin:0;color:var(--muted);font-size:13px}.pill{display:inline-flex;margin-top:20px;padding:6px 11px;border-radius:99px;background:rgba(122,199,255,.16);border:1px solid rgba(122,199,255,.22);color:#bde4ff;font-size:12px}@media(max-width:800px){main{padding:28px 22px}.hero{grid-template-columns:1fr}.songs{grid-template-columns:1fr 1fr}h1{font-size:34px}}@media(max-width:520px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:2;bottom:0;left:0;right:0;height:68px;flex-direction:row;justify-content:center;padding:9px;border-right:0;border-top:1px solid var(--stroke)}.logo,.spacer{display:none}main{padding-bottom:94px}header{align-items:flex-start;gap:18px;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.songs{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body><div class="app"><aside aria-label="主导航"><div class="logo">♫</div><button class="nav active">⌂</button><button class="nav">☷</button><button class="nav">◌</button><button class="nav">✦</button><div class="spacer"></div><button class="nav">◐</button><button class="nav">⚙</button></aside><main><header><div><div class="eyebrow">主播工作台 · Liquid Glass</div><h1>今晚，唱点好听的。</h1></div><div class="actions"><button class="btn" id="refresh">↻ 刷新预览</button><button class="btn primary">导出海报　→</button></div></header><section class="hero"><article class="glass card poster"><div class="poster-label">当前海报 · 抖音全屏 9:20</div><div class="poster-title">夏日歌单<br>Vol. 07</div><div class="poster-sub">12 首精选 · 预计 48 分钟</div><div class="poster-meta">液态玻璃 · 默认主题预览</div></article><article class="glass card insight"><div><div class="eyebrow">本周演出准备度</div><div class="metric">72<span style="font-size:25px">%</span> <small>已完成</small></div><div class="progress"><i></i></div><div class="caption">还差 5 首歌完成今晚的歌单</div></div><button class="btn primary" style="width:max-content">继续准备　→</button></article></section><section><div class="section-head"><h2>最近使用的歌曲</h2><span class="link">查看全部　→</span></div><div class="songs"><article class="glass card song"><span class="song-num">01</span><h3>想去海边</h3><p>夏日歌单 · 已学会</p><span class="pill">主推</span></article><article class="glass card song"><span class="song-num">02</span><h3>晴天</h3><p>周杰伦 · C 大调</p><span class="pill">熟练度 90%</span></article><article class="glass card song"><span class="song-num">03</span><h3>慢慢喜欢你</h3><p>莫文蔚 · G 大调</p><span class="pill">熟练度 76%</span></article></div></section></main></div><script>document.getElementById('refresh').onclick=e=>{e.currentTarget.textContent='✓ 已刷新';setTimeout(()=>e.currentTarget.textContent='↻ 刷新预览',1200)};</script></body></html>
