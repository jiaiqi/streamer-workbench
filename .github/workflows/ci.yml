# 主播工作台 · CI 流水线
#
# 质量门：
#   1. Python 单元、AppContext、持久化、冻结导出与 API 合约测试（当前 174 项）
#   2. 金标准逐像素对比（16 张，diff=0 死线）
#   3. 前端纯函数测试
#   4. TypeScript 编译与生产构建
#
# 金标准参照图（tests/golden/）随 git 提交，是版本化的回归基准，
# 由独立预言机（旧脚本 build_playlist.py，178 首版）生成。
# 禁止引擎自举覆盖——参照图与被测对象同源会让 diff=0 变成恒等式。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Python 环境（版本与本地锁定一致）----
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 Python 依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # ---- Node 环境 ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---- 门 1：单元测试 ----
      - name: 单元测试
        run: .venv/bin/python tests/test_unit.py

      - name: AppContext 与数据目录测试
        run: .venv/bin/python tests/test_app_context.py

      - name: Repository 可靠性测试
        run: .venv/bin/python tests/test_repositories.py

      - name: EventStore 索引与恢复测试
        run: .venv/bin/python tests/test_event_store.py

      - name: PresetRepository 跨文件事务测试
        run: .venv/bin/python tests/test_preset_repository.py

      - name: Preset Application Service 测试
        run: .venv/bin/python tests/test_preset_service.py

      - name: Settings Application Service 测试
        run: .venv/bin/python tests/test_settings_service.py

      - name: RenderDocument 与冻结导出测试
        run: .venv/bin/python tests/test_render_document.py

      - name: 曲谱附件跨资源事务测试
        run: .venv/bin/python tests/test_tab_service.py

      - name: API 合约测试
        run: .venv/bin/python tests/test_api_contract.py

      - name: OpenAPI TypeScript 类型漂移检查
        run: .venv/bin/python tools/generate_api_types.py --check

      # ---- 门 2：金标准逐像素对比（参照图随仓库检出）----
      - name: 金标准测试（diff=0 死线）
        run: PYTHONPATH=. .venv/bin/python tests/test_golden.py

      # ---- 门 3：TypeScript 编译检查 ----
      - name: 安装前端依赖
        working-directory: ui
        run: npm ci

      - name: TS 编译检查
        working-directory: ui
        run: npx tsc --noEmit

      - name: 前端纯函数测试
        working-directory: ui
        run: npm test

      - name: 前端生产构建
        working-directory: ui
        run: npm run build

      # ---- 汇总 ----
      - name: ✅ 全部质量门通过
        run: echo "Python/AppContext/持久化/冻结导出/API 合约 + 金标准 diff=0 + 前端测试 + TS 编译/构建 —— 全部通过"
